services:
  postgres:
    restart: unless-stopped
    mem_limit: 768m
    mem_reservation: 384m
    cpus: 0.50
    logging:
      driver: json-file
      options: {max-size: "10m", max-file: "3"}

  redis:
    restart: unless-stopped
    mem_limit: 256m
    mem_reservation: 128m
    cpus: 0.25
    command:
      - redis-server
      - --appendonly
      - "yes"
      - --maxmemory
      - 160mb
      - --maxmemory-policy
      - noeviction
    logging:
      driver: json-file
      options: {max-size: "10m", max-file: "3"}

  market-data:
    restart: unless-stopped
    mem_limit: 512m
    mem_reservation: 256m
    cpus: 0.50
    logging:
      driver: json-file
      options: {max-size: "10m", max-file: "3"}

  ingest-gateway:
    restart: unless-stopped
    mem_limit: 384m
    mem_reservation: 192m
    cpus: 0.50
    healthcheck:
      test: ["CMD", "python", "-c", "import urllib.request; urllib.request.urlopen('http://localhost:8080/healthz', timeout=3)"]
      interval: 10s
      timeout: 5s
      retries: 5
    logging:
      driver: json-file
      options: {max-size: "10m", max-file: "3"}

  core-scorer:
    restart: unless-stopped
    mem_limit: 384m
    mem_reservation: 192m
    cpus: 0.50
    healthcheck:
      test: ["CMD", "python", "-c", "import urllib.request; urllib.request.urlopen('http://localhost:8000/healthz', timeout=3)"]
      interval: 10s
      timeout: 5s
      retries: 5
    logging:
      driver: json-file
      options: {max-size: "10m", max-file: "3"}

  fusion-engine:
    restart: unless-stopped
    mem_limit: 512m
    mem_reservation: 256m
    cpus: 0.75
    logging:
      driver: json-file
      options: {max-size: "10m", max-file: "3"}

  state-api:
    restart: unless-stopped
    mem_limit: 512m
    mem_reservation: 256m
    cpus: 0.75
    environment:
      # core-scorer and fusion-engine are required for Tier A, so the inspector
      # probes them by default: when they are not running the honest report is
      # "offline", not "not configured". ingest-gateway serves the legacy
      # events path, is not required for Tier A, and stays unset until it is
      # intentionally admitted. Any of these can be overridden or blanked.
      INGEST_GATEWAY_URL: ${PIPELINE_INGEST_GATEWAY_URL:-}
      # TradingView (and Strike Zone Pine) webhook. Empty by default: an
      # unauthenticated public endpoint into a trading system is not an
      # acceptable default, and TradingView cannot send auth headers so
      # the secret must travel in the alert body.
      TRADINGVIEW_WEBHOOK_SECRET: ${TRADINGVIEW_WEBHOOK_SECRET:-}
      # The public address the tunnel exposes; shown on the pipeline, never used to send.
      TRADINGVIEW_PUBLIC_URL: ${TRADINGVIEW_PUBLIC_URL:-}
      # Separate control authorization for mobile enrollment/test sends.
      # Empty means disabled. Never use a wallet key here.
      MOBILE_ALERTS_CONTROL_KEY: ${MOBILE_ALERTS_CONTROL_KEY:-}
      # FRED (free key from https://fredaccount.stlouisfed.org/apikeys). Set both
      # in runtime.env; the key is read here only, never printed. Enables the
      # macro-reference provider and adds official release dates to the
      # Mission Control events strip.
      FRED_API_KEY: ${FRED_API_KEY:-}
      FRED_CONTEXT_ENABLED: ${FRED_CONTEXT_ENABLED:-false}
      CORE_SCORER_URL: ${PIPELINE_CORE_SCORER_URL:-http://core-scorer:8000}
      FUSION_ENGINE_URL: ${PIPELINE_FUSION_ENGINE_URL:-http://fusion-engine:8002}
      # state-api reports dry_run on paths where nothing reached a venue. Same
      # variable and same value as exec-hl-svc, so the two cannot disagree about
      # which mode the system is in.
      DRY_RUN: "true"
      # Advisory agent harness (Hermes / OpenClaw / a local Ollama). Unset by
      # default: a harness is optional and TradeSync must work without one.
      # The boundary is enforced in code — a response carrying a score,
      # direction, approval or order field is refused by name, and every
      # accepted answer is filed in quarantine, never in evidence.
      # host.docker.internal reaches a runtime on the operator's machine.
      AGENT_HARNESS_URL: ${AGENT_HARNESS_URL:-}
      AGENT_HARNESS_MODEL: ${AGENT_HARNESS_MODEL:-llama3.1:8b}
      # "ollama" (default) or "openai": the Hermes gateway's API server speaks
      # the OpenAI dialect at http://host.docker.internal:8642 with a Bearer
      # key (its API_SERVER_KEY, copied file-to-file into runtime.env as
      # AGENT_HARNESS_KEY; never displayed, never logged).
      AGENT_HARNESS_API: ${AGENT_HARNESS_API:-ollama}
      AGENT_HARNESS_KEY: ${AGENT_HARNESS_KEY:-}
      # The isolated signer and the account to preview. The address is public;
      # the key that controls it lives only in signer-svc's own environment and
      # never appears in this service.
      SIGNER_URL: ${SIGNER_URL:-http://signer-svc:8006}
      WALLET_ADDRESS: ${WALLET_ADDRESS:-}
      # ChaseOS knowledge-graph snapshots. Unset by default: a knowledge
      # connector that switches itself on because a path happens to exist is a
      # connector the operator did not choose to run. Set
      # CHASEOS_GRAPH_HOST_DIR to the vault's .chaseos/graph directory to
      # enable it; the mount below is :ro, so nothing here can write canonical
      # knowledge even if the code tried to.
      CHASEOS_GRAPH_DIR: ${CHASEOS_GRAPH_DIR:-}
      # Where the host renderer writes edition narration and video; mounted
      # read-only below. Served only by name under /state/thesis/editions.
      EDITIONS_DIR: /editions
      THESIS_EDITION_TZ: ${THESIS_EDITION_TZ:-Europe/London}
      THESIS_EDITION_SCHEDULE: ${THESIS_EDITION_SCHEDULE:-ny-premarket=12:00,ny-midday=17:30,session-handoff=23:30}
      # Charts of the StrikeZone quant lab's trade calls and outcomes, copied by
      # tools/strikezone_quant_bridge.py; mounted read-only below, served by name.
      STRIKEZONE_CHARTS_DIR: /strikezone-charts
    volumes:
      # Bound to a harmless default so the compose file is valid whether or not
      # the connector is configured. Read-only in every case.
      - ${CHASEOS_GRAPH_HOST_DIR:-./sql}:/knowledge/chaseos-graph:ro
      - ${EDITIONS_HOST_DIR:-./sql}:/editions:ro
      - ${STRIKEZONE_CHARTS_HOST_DIR:-./sql}:/strikezone-charts:ro
    extra_hosts:
      # Docker Desktop resolves this already; declaring it keeps the same
      # compose file working against a Linux engine, where it does not.
      - "host.docker.internal:host-gateway"
    healthcheck:
      test: ["CMD", "python", "-c", "import urllib.request; urllib.request.urlopen('http://localhost:8000/healthz', timeout=3)"]
      interval: 10s
      timeout: 5s
      retries: 5
    logging:
      driver: json-file
      options: {max-size: "10m", max-file: "3"}

  qdrant:
    profiles: [evidence]
    mem_limit: 768m
    mem_reservation: 384m
    cpus: 0.50
    logging:
      driver: json-file
      options: {max-size: "10m", max-file: "3"}

  cockpit-ui:
    profiles: [operator]
    mem_limit: 256m
    mem_reservation: 128m
    cpus: 0.25
    logging:
      driver: json-file
      options: {max-size: "10m", max-file: "3"}

  exec-hl-svc:
    profiles: [paper-exec]
    restart: unless-stopped
    mem_limit: 384m
    mem_reservation: 192m
    cpus: 0.50
    environment:
      DRY_RUN: "true"
      EXECUTION_ENABLED: "false"
    logging:
      driver: json-file
      options: {max-size: "10m", max-file: "3"}

  backtest-runner:
    profiles: [analytics]
    mem_limit: 2g
    mem_reservation: 512m
    cpus: 2.00
    logging:
      driver: json-file
      options: {max-size: "20m", max-file: "3"}

  # Reads the ChaseOS agent channels (Hermes fleet, Strike Zone alerts) on the
  # operator's private Discord into quarantine, with provenance. Read-only:
  # it never posts to Discord, never talks to a model, never touches the
  # catalog. Idle unless DISCORD_BOT_TOKEN and DISCORD_READER_CHANNELS are set
  # in runtime.env (the token via tools/set-runtime-secret.ps1, never in git).
  # DISCORD_READER_CHANNELS is "label=channel_id[:kind],..." with kind one of
  # agent | alerts | operator.
  discord-reader:
    build:
      context: ..
      dockerfile: services/discord-reader/Dockerfile
    restart: unless-stopped
    mem_limit: 128m
    mem_reservation: 64m
    cpus: 0.10
    environment:
      STATE_API_URL: http://state-api:8000
      REDIS_URL: redis://redis:6379
      DISCORD_BOT_TOKEN: ${DISCORD_BOT_TOKEN:-}
      DISCORD_READER_CHANNELS: ${DISCORD_READER_CHANNELS:-}
      DISCORD_POLL_SECONDS: ${DISCORD_POLL_SECONDS:-30}
    depends_on:
      redis:
        condition: service_healthy
      state-api:
        condition: service_started
    logging:
      driver: json-file
      options: {max-size: "10m", max-file: "3"}
